# 自动驾驶晨报 — 信源分类注册表
# 五类聚合平台（中文综合 / 垂直 / 海外 / 标准化API / RSS开源），机器可读。
# collect_news.py 与 LLM 检索指南共用此表：
#   - method=web 且 scrapable=true  → 由 collect_news.py 直接爬 list_url
#   - method=api                     → 由 collect_news.py 的对应 handler 拉取（HN 已实装）
#   - method=rss / needs_key=true     → 暂不自动抓，需部署 RSSHub 或配 API key 后接入
# 完整可爬站点同时会在 search_matrix.yaml 的 media_crawl.sites 中声明（爬虫实际消费的是后者）。

meta:
  updated: "2026-07-07"
  note: "本表为信源全量目录；爬虫实际抓取范围以 search_matrix.yaml 的 media_crawl.{sites,feeds,apis} 为准（collect_news.py 已消费这三段）。"

sources:
