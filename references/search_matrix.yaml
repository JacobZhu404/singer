    name: "头部企业动向"
    priority: 10
    section: "行业动态"
    keywords:
      - "智能驾驶 智驾 自动驾驶"
      - "Waymo"
      - "Tesla FSD Cybercab"
      - "百度Apollo 萝卜快跑"
      - "小马智行 Pony.ai"
      - "文远知行 WeRide"
      - "滴滴 自动驾驶"
      - "元戎启行 DeepRoute"
      - "华为 智能驾驶 自动驾驶 智驾 乾崑"
      - "大疆 卓驭 智驾"
      - "小鹏 XNGP VLA 智驾"
      - "理想 AD 智驾"
      - "蔚来 智驾"
      - "小米 智驾 智能驾驶"
