# ────────────────────────── 不凑数原则 ──────────────────────────

quality:
  no_pad_sections: true          # 严禁为凑数强行填充版块
  min_relevance: "行业关注度或实际影响"
  stale_drop_days: 30            # 超30天直接排除
  url_authenticity: "所有URL必须从WebSearch结果中提取,严禁编造"
  date_verification: "必须用WebFetch验证每篇文章的实际发表日期"
