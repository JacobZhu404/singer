# 自动驾驶晨报 — 搜索矩阵
# LLM 按此矩阵执行搜索，覆盖 12 组 + 热榜，确保不遗漏
# 用法：Agent 读取此文件 → 逐组执行 WebSearch/WebFetch → 结果汇集到 candidates.json

meta:
  version: "2.0"
  updated: "2026-07-06"
  description: "执行流程: 先热榜(P1→P2→P3), 再按优先级降序执行 12 组搜索。每组取前5-10条结果, 去重后标记 section。"

# ────────────────────────── 时效性规则 ──────────────────────────

freshness:
  default_days: 3              # 默认收录近3天内新闻
  exception_days: 14           # 重大事件放宽到14天
  exception_triggers:          # 触发放宽条件的标识
    - "全球首创"
    - "里程碑法规"
    - "百亿融资"
    - "颠覆性技术"
    - "国际标准获批"

# ────────────────────────── 热榜数据源 ──────────────────────────

hotlist:
  - rank: "P1"
    url: "https://tophub.today"
    method: "WebFetch"
    description: "日热榜（微博/知乎/微信/36氪/IT之家/虎嗅/量子位）"
    keywords: ["智能驾驶", "自动驾驶", "robotaxi", "Waymo", "Tesla", "萝卜快跑", "华为智驾", "具身智能"]
    action: "提取含关键词标题 → 二次搜索溯源原始URL"

  - rank: "P2"
    url: "https://buzzing.cc"
    method: "WebFetch"
    description: "海外信息差（HN/Reddit/彭博/经济学人）"
    keywords: ["autonomous driving", "robotaxi", "Waymo", "Tesla FSD", "self-driving"]
    action: "提取含关键词标题 → 跳转原文获取URL"

  - rank: "P3"
    url: "https://newsnow.busiyi.world"
    method: "WebFetch"
    description: "综合新闻补充（百度/知乎/微博/B站）"
    keywords: ["智能驾驶", "自动驾驶", "robotaxi", "智驾", "端到端", "世界模型"]
    action: "提取含关键词标题 → 二次搜索获取原始来源"

# ────────────────────────── 12 组搜索 ──────────────────────────

search_groups:
