        keywords:
          - "芯片 架构 突破 新范式 2026"
          - "半导体 理论 新定律 论文"
          - "华为 半导体 芯片 理论 突破"
          - "台积电 制程 突破 2026"

  - id: 10
    name: "聚合门户扫站"
    priority: 2
    section: "按内容归入对应版块"
    keywords:
      - "site:guancha.cn 智能驾驶"
      - "site:leiphone.com 智能驾驶"

# ────────────────────────── 覆盖企业列表 ──────────────────────────

companies:
  - Waymo, Tesla, 百度Apollo, 小马智行, 文远知行
  - 滴滴自动驾驶, 元戎启行, 华为, 大疆(卓驭)
  - 小鹏, 理想, 蔚来, 小米, Momenta, 地平线, 英伟达
  - Uber, Wayve
  - Google, Amazon, Meta, OpenAI, Anthropic, 台积电

# ────────────────────────── 不凑数原则 ──────────────────────────

quality:
  no_pad_sections: true
  min_relevance: "行业关注度或实际影响"
  stale_drop_days: 30
  url_authenticity: "所有URL必须从WebSearch结果中提取,严禁编造"
  date_verification: "必须用WebFetch验证每篇文章的实际发表日期"
